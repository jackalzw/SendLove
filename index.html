<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SendLove: send a surprise they solve to open</title>
<meta name="description" content="SendLove lets you send someone a surprise. Pick an occasion, add a message and pictures, and they solve a sliding puzzle to open it.">
<link rel="canonical" href="https://sendloves.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="SendLove">
<meta property="og:description" content="SendLove lets you send someone a surprise. Pick an occasion, add a message and pictures, and they solve a sliding puzzle to open it.">
<meta property="og:url" content="https://sendloves.netlify.app/">
<meta name="google-site-verification" content="sU1pU3QrxZ1DttQQggCnWaozZ0hZdocqMXhhT07NOs4" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=Outfit:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1530;--panel:#19214a;--ink:#f3f1ff;--mut:#a9aed6;--acc:#8ff0c8;--acc2:#b9a7ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 20px 64px}
h1{font:800 clamp(2.1rem,8vw,3rem)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 10px}
p{margin:0 0 14px;color:var(--mut)}
label,.lbl{display:block;font-weight:600;margin:26px 0 8px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:12px;padding:12px 14px}
textarea{min-height:130px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--acc2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:999px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:#0f1530;font-weight:600}
.chip:focus-visible,.btn:focus-visible,.x:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.drop{display:block;text-align:center;border:2px dashed var(--acc2);border-radius:14px;padding:18px;color:var(--mut);cursor:pointer;margin:0}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px}
.th{position:relative}
.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.th span{position:absolute;left:6px;bottom:6px;background:var(--acc);color:#0f1530;font-size:.72rem;font-weight:600;border-radius:6px;padding:1px 6px}
.x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(15,21,48,.85);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;background:var(--acc);color:#0f1530}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn.sm{padding:6px 14px;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
#go{margin-top:30px}
#status{margin-top:16px;color:var(--mut)}
.card{margin-top:22px;background:var(--panel);border-radius:16px;padding:16px}
.card input{margin:8px 0 12px}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.card a.btn{text-decoration:none;display:inline-block}
.wm{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);text-align:center;font-size:.8rem;color:var(--mut);opacity:.75;pointer-events:none;z-index:4}
.mine{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.mine a{color:var(--acc);word-break:break-all}
</style>
<link rel="stylesheet" href="/glass.css">
</head>
<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <h1>SendLove</h1>
  <p>Send someone a surprise. Pick the occasion, add your message and pictures. They solve the puzzle to open it.</p>

  <div class="lbl" id="occL">Occasion</div>
  <div class="chips" id="occ" role="group" aria-labelledby="occL"></div>

  <label for="name">Their name</label>
  <input type="text" id="name" maxlength="40" autocomplete="off" placeholder="Who is it for?">

  <label for="msg">Your message</label>
  <textarea id="msg" maxlength="1000"></textarea>

  <div class="lbl">Pictures</div>
  <label class="drop" for="files">Tap to add pictures (up to 8). The first one becomes the puzzle.<input type="file" id="files" accept="image/*" multiple></label>
  <div class="thumbs" id="thumbs"></div>

  <div class="lbl" id="lvL">Difficulty</div>
  <div class="chips" id="lv" role="group" aria-labelledby="lvL"></div>

  <button class="btn" id="go" type="button" disabled>Create my link</button>
  <div id="status" role="status"></div>

  <div class="card" id="result" hidden>
    <strong>Your link is ready</strong>
    <input type="text" id="link" readonly aria-label="Your link">
    <div class="row">
      <button class="btn" id="copy" type="button">Copy link</button>
      <a class="btn alt" id="open" target="_blank" rel="noopener">Open it</a>
    </div>
  </div>

  <div class="card" id="mineWrap" hidden>
    <strong>Your puzzles on this device</strong>
    <div id="mine"></div>
  </div>
</main>
<div class="wm">powered by Pardon Chida</div>
<script src="/shared.js"></script>
<script>
const $ = id => document.getElementById(id);
const MAX = 8;
let occ = 0, lvl = 0, photos = [];

function chips(host, items, get, set) {
  host.innerHTML = "";
  items.forEach((it, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = it.k;
    b.setAttribute("aria-pressed", String(i === get()));
    b.addEventListener("click", () => { set(i); chips(host, items, get, set); sync(); });
    host.appendChild(b);
  });
}
function ready() { return $("name").value.trim() && $("msg").value.trim() && photos.length > 0; }
function sync(note) {
  $("msg").placeholder = OCC[occ].ph;
  $("go").disabled = !ready();
  $("status").textContent = note || (ready() ? "" : (photos.length ? "Add a name and a message to continue." : "Add at least one picture to continue."));
}
function thumbs() {
  const host = $("thumbs"); host.innerHTML = "";
  photos.forEach((src, i) => {
    const d = document.createElement("div"); d.className = "th";
    const im = document.createElement("img"); im.src = src; im.alt = "";
    const x = document.createElement("button"); x.type = "button"; x.className = "x"; x.textContent = "×";
    x.setAttribute("aria-label", "Remove picture " + (i + 1));
    x.addEventListener("click", () => { photos.splice(i, 1); thumbs(); sync(); });
    d.appendChild(im); d.appendChild(x);
    if (i === 0) { const s = document.createElement("span"); s.textContent = "Puzzle"; d.appendChild(s); }
    host.appendChild(d);
  });
}
function toSquare(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const w = im.naturalWidth, h = im.naturalHeight, s = Math.min(w, h);
        const sx = w > h ? (w - h) / 2 : 0, sy = h > w ? (h - w) * 0.3 : 0;
        const c = document.createElement("canvas"); c.width = c.height = 640;
        c.getContext("2d").drawImage(im, sx, sy, s, s, 0, 0, 640, 640);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
$("files").addEventListener("change", async e => {
  const list = Array.from(e.target.files); e.target.value = "";
  let note = "";
  for (const f of list) {
    if (photos.length >= MAX) { note = "That’s the maximum of " + MAX + " pictures."; break; }
    try { photos.push(await toSquare(f)); } catch (err) { note = "Couldn’t read " + f.name + ". Try a JPG or PNG."; }
  }
  thumbs(); sync(note);
});
$("name").addEventListener("input", () => sync());
$("msg").addEventListener("input", () => sync());

const linkFor = id => location.origin + "/p/" + id;
function mineList() { try { return JSON.parse(localStorage.getItem("sendlove-mine") || "[]"); } catch (e) { return []; } }
function saveMine(a) { try { localStorage.setItem("sendlove-mine", JSON.stringify(a)); } catch (e) {} }
function renderMine() {
  const a = mineList(), host = $("mine"); host.innerHTML = "";
  $("mineWrap").hidden = !a.length;
  a.forEach(m => {
    const row = document.createElement("div"); row.className = "mine";
    const l = document.createElement("a"); l.href = linkFor(m.id); l.target = "_blank"; l.rel = "noopener"; l.textContent = "For " + m.to;
    const d = document.createElement("button"); d.type = "button"; d.className = "btn alt sm"; d.textContent = "Delete";
    d.addEventListener("click", async () => {
      if (!confirm("Delete this puzzle? The link will stop working.")) return;
      try {
        const r = await fetch("/api/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: m.id, token: m.token }) });
        if (r.ok || r.status === 404) { saveMine(mineList().filter(x => x.id !== m.id)); renderMine(); }
        else sync("Couldn’t delete it. Try again.");
      } catch (e) { sync("Couldn’t delete it. Try again."); }
    });
    row.appendChild(l); row.appendChild(d); host.appendChild(row);
  });
}

$("go").addEventListener("click", async () => {
  $("go").disabled = true; $("status").textContent = "Creating your link…";
  try {
    const r = await fetch("/api/create", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to: $("name").value.trim(), message: $("msg").value.trim(), occasion: OCC[occ].key, level: LEVELS[lvl].key, photos })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Something went wrong.");
    const url = linkFor(d.id);
    $("link").value = url; $("open").href = url; $("result").hidden = false;
    saveMine([{ id: d.id, token: d.token, to: $("name").value.trim() }].concat(mineList()));
    renderMine(); $("status").textContent = ""; $("result").scrollIntoView({ behavior: "smooth" });
  } catch (e) { sync(e.message || "Something went wrong. Try again."); }
  $("go").disabled = !ready();
});
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("link").value); $("copy").textContent = "Copied"; }
  catch (e) { $("link").select(); $("copy").textContent = "Press copy on your keyboard"; }
});

chips($("occ"), OCC, () => occ, i => occ = i);
chips($("lv"), LEVELS, () => lvl, i => lvl = i);
renderMine(); sync();
</script>
</body>
</html>
