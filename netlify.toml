[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/p/*"
  to = "/view.html"
  status = 200

[[headers]]
  for = "/p/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/view.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
